<body>

<header class="nav solid" id="nav">
  <a href="/" class="brand">
    <img src="assets/logos/logo.webp" alt="">
    <span>ESCÁNDALO</span>
  </a>
  <button class="burger" id="burger" aria-label="Menú"><span></span><span></span></button>

<main>
  <section class="login-sec">
    <form class="login-caja" id="login-form" novalidate>
      <img class="login-logo" src="assets/logos/logo.webp" alt="">
      <h1>Ingresar</h1>
      <p>Elegí tu nombre y escribí tu contraseña.</p>
      <label for="login-jugador">Jugador</label>
      <select id="login-jugador"></select>
      <label for="login-clave">Contraseña</label>
      <input id="login-clave" type="password" autocomplete="current-password" placeholder="Tu contraseña">
      <small class="login-error" id="login-error" aria-live="polite"></small>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </section>
</main>

  </div>
